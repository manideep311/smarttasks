services:
  db:
    image: postgres:17
    container_name: smarttasks-db
    environment:
      POSTGRES_DB: smarttasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - smarttasks_data:/var/lib/postgresql/data

volumes:
  smarttasks_data:
